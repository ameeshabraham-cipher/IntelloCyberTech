<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  
  <!-- SOC2 Five Trust Principles -->
  <g transform="translate(300, 200) scale(0.9)">
    <circle cx="0" cy="0" r="120" fill="#111530" stroke="#00E5FF" strokeWidth="1" opacity="0.5"/>
    
    <!-- Central Security Icon -->
    <circle cx="0" cy="0" r="40" fill="#111530" stroke="#EB3443" strokeWidth="2"/>
    <path d="M0 -20 Q15 -15 15 0 Q15 15 0 20 Q-15 15 -15 0 Q-15 -15 0 -20" fill="none" stroke="#00E5FF" strokeWidth="2"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#00E5FF"/>
    
    <!-- Five Trust Principle Nodes -->
    <g transform="rotate(0)">
      <circle cx="0" cy="-90" r="25" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
      <text x="0" y="-85" fill="#FFFFFF" font-size="11" text-anchor="middle" font-family="Arial">Security</text>
      <path d="M0 -65 L0 -40" stroke="#FFFFFF" strokeWidth="1.5" stroke-dasharray="5 3"/>
    </g>
    
    <g transform="rotate(72)">
      <circle cx="0" cy="-90" r="25" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
      <text x="0" y="-90" fill="#FFFFFF" font-size="11" text-anchor="middle" font-family="Arial">Availability</text>
      <path d="M0 -65 L0 -40" stroke="#FFFFFF" strokeWidth="1.5" stroke-dasharray="5 3"/>
    </g>
    
    <g transform="rotate(144)">
      <circle cx="0" cy="-90" r="25" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
      <text x="0" y="-95" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Processing</text>
      <text x="0" y="-83" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Integrity</text>
      <path d="M0 -65 L0 -40" stroke="#FFFFFF" strokeWidth="1.5" stroke-dasharray="5 3"/>
    </g>
    
    <g transform="rotate(216)">
      <circle cx="0" cy="-90" r="25" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
      <text x="0" y="-95" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Confidentiality</text>
      <path d="M0 -65 L0 -40" stroke="#FFFFFF" strokeWidth="1.5" stroke-dasharray="5 3"/>
    </g>
    
    <g transform="rotate(288)">
      <circle cx="0" cy="-90" r="25" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
      <text x="0" y="-90" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Privacy</text>
      <path d="M0 -65 L0 -40" stroke="#FFFFFF" strokeWidth="1.5" stroke-dasharray="5 3"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="300" y="350" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">SOC 2 Type II</text>
  <text x="300" y="375" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Trust Services Criteria</text>
</svg>