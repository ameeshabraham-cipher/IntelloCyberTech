<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  
  <!-- Neural Network Background -->
  <g opacity="0.2">
    <!-- Neural Network Nodes -->
    <circle cx="150" cy="150" r="8" fill="#00E5FF"/>
    <circle cx="150" cy="200" r="8" fill="#00E5FF"/>
    <circle cx="150" cy="250" r="8" fill="#00E5FF"/>
    
    <circle cx="300" cy="130" r="8" fill="#00E5FF"/>
    <circle cx="300" cy="180" r="8" fill="#00E5FF"/>
    <circle cx="300" cy="230" r="8" fill="#00E5FF"/>
    <circle cx="300" cy="280" r="8" fill="#00E5FF"/>
    
    <circle cx="450" cy="150" r="8" fill="#00E5FF"/>
    <circle cx="450" cy="200" r="8" fill="#00E5FF"/>
    <circle cx="450" cy="250" r="8" fill="#00E5FF"/>
    
    <!-- Connections -->
    <path d="M150 150 L300 130" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 150 L300 180" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 150 L300 230" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 150 L300 280" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M150 200 L300 130" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 200 L300 180" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 200 L300 230" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 200 L300 280" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M150 250 L300 130" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 250 L300 180" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 250 L300 230" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M150 250 L300 280" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M300 130 L450 150" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 130 L450 200" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 130 L450 250" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M300 180 L450 150" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 180 L450 200" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 180 L450 250" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M300 230 L450 150" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 230 L450 200" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 230 L450 250" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M300 280 L450 150" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 280 L450 200" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 280 L450 250" stroke="#00E5FF" strokeWidth="1"/>
  </g>
  
  <!-- Central Elements -->
  <g transform="translate(300, 200)">
    <!-- AI Chip/Brain Hybrid -->
    <rect x="-40" y="-40" width="80" height="80" rx="5" fill="#111530" stroke="#00E5FF" strokeWidth="2"/>
    
    <!-- Chip Lines -->
    <path d="M-40 -20 H-20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M-40 0 H-20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M-40 20 H-20" stroke="#00E5FF" strokeWidth="1.5"/>
    
    <path d="M40 -20 H20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M40 0 H20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M40 20 H20" stroke="#00E5FF" strokeWidth="1.5"/>
    
    <path d="M-20 -40 V-20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M0 -40 V-20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M20 -40 V-20" stroke="#00E5FF" strokeWidth="1.5"/>
    
    <path d="M-20 40 V20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M0 40 V20" stroke="#00E5FF" strokeWidth="1.5"/>
    <path d="M20 40 V20" stroke="#00E5FF" strokeWidth="1.5"/>
    
    <!-- Brain Elements -->
    <path d="M-15 -15 C-5 -25, 5 -25, 15 -15" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
    <path d="M-15 -5 C-5 -15, 5 -15, 15 -5" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
    <path d="M-15 5 C-5 -5, 5 -5, 15 5" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
    <path d="M-15 15 C-5 5, 5 5, 15 15" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
  </g>
  
  <!-- Compliance Elements -->
  <g>
    <!-- Document -->
    <rect x="180" y="120" width="40" height="50" rx="2" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M190 130 H210" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M190 140 H210" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M190 150 H210" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M180 120 L200 110 L220 120" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    
    <!-- Checklist -->
    <rect x="180" y="230" width="40" height="50" rx="2" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M190 245 L195 250 L205 240" stroke="#EB3443" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M210 245 H215" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M190 260 L195 265 L205 255" stroke="#EB3443" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M210 260 H215" stroke="#FFFFFF" strokeWidth="1"/>
    
    <!-- Shield -->
    <path d="M420 120 Q440 130 440 150 Q440 170 420 180 Q400 170 400 150 Q400 130 420 120" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M410 150 L415 155 L425 145" stroke="#EB3443" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    
    <!-- Rulebook -->
    <rect x="390" y="230" width="60" height="50" rx="2" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M390 230 Q420 220 450 230" fill="none" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M420 230 V280" stroke="#FFFFFF" strokeWidth="1"/>
    <text x="405" y="255" fill="#FFFFFF" font-size="10" font-family="Arial">AI</text>
    <text x="435" y="255" fill="#FFFFFF" font-size="10" font-family="Arial">Rules</text>
  </g>
  
  <!-- Connection Lines to AI Core -->
  <path d="M220 145 L260 200" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M220 255 L260 200" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M400 150 L340 200" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M390 255 L340 200" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  
  <!-- Text -->
  <text x="300" y="350" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">AI Compliance Automation</text>
  <text x="300" y="375" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Intelligent Regulation Management</text>
</svg>