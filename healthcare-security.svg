<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  
  <!-- Healthcare Symbol -->
  <g transform="translate(300, 190)">
    <circle cx="0" cy="0" r="80" fill="#111530" stroke="#00E5FF" strokeWidth="2" opacity="0.7"/>
    <path d="M-20 -50 H20 V-10 H60 V30 H20 V70 H-20 V30 H-60 V-10 H-20 Z" fill="none" stroke="#FFFFFF" strokeWidth="3"/>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(300, 190) scale(0.8)">
    <path d="M0 -70 Q50 -50 50 0 Q50 50 0 80 Q-50 50 -50 0 Q-50 -50 0 -70" fill="#111530" stroke="#EB3443" strokeWidth="2" opacity="0.9"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#EB3443" strokeWidth="1.5"/>
    <rect x="-5" y="-15" width="10" height="30" rx="2" fill="#111530" stroke="#EB3443" strokeWidth="1.5"/>
    <circle cx="0" cy="-15" r="3" fill="#EB3443"/>
  </g>
  
  <!-- Patient Data Elements -->
  <g opacity="0.8">
    <!-- EHR Record -->
    <rect x="120" y="130" width="70" height="90" rx="3" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M130 150 H180" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M130 160 H180" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M130 170 H180" stroke="#FFFFFF" strokeWidth="1"/>
    <path d="M130 190 H180" stroke="#FFFFFF" strokeWidth="1"/>
    <text x="155" y="145" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">EHR Data</text>
    
    <!-- Biomedical Device -->
    <rect x="120" y="250" width="70" height="40" rx="5" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <circle cx="140" cy="270" r="10" fill="none" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M138 270 L142 270" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M140 268 L140 272" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M155 265 L175 265" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M155 270 L175 270" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M155 275 L175 275" stroke="#00E5FF" strokeWidth="1"/>
    
    <!-- Health App -->
    <rect x="410" y="130" width="70" height="90" rx="10" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <rect x="420" y="140" width="50" height="30" rx="3" fill="#111530" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M430 185 L450 160" stroke="#EB3443" strokeWidth="1.5"/>
    <path d="M430 160 L450 185" stroke="#EB3443" strokeWidth="1.5"/>
    <circle cx="445" cy="200" r="8" fill="none" stroke="#FFFFFF" strokeWidth="1"/>
    
    <!-- Genomic Data -->
    <rect x="410" y="250" width="70" height="40" rx="3" fill="#111530" stroke="#FFFFFF" strokeWidth="1.5"/>
    <path d="M420 260 C 425 255, 435 275, 440 270" stroke="#00E5FF" strokeWidth="1" fill="none"/>
    <path d="M440 270 C 445 265, 455 285, 460 280" stroke="#00E5FF" strokeWidth="1" fill="none"/>
    <path d="M420 280 C 425 275, 435 295, 440 290" stroke="#00E5FF" strokeWidth="1" fill="none"/>
    <path d="M440 290 C 445 285, 455 305, 460 300" stroke="#00E5FF" strokeWidth="1" fill="none"/>
    <text x="445" y="270" fill="#FFFFFF" font-size="8" text-anchor="middle" font-family="Arial">Genomic</text>
  </g>
  
  <!-- Secured Connections -->
  <path d="M190 170 L260 190" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M190 270 L260 190" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M410 170 L340 190" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  <path d="M410 270 L340 190" stroke="#00E5FF" strokeWidth="1.5" strokeDasharray="5 3"/>
  
  <!-- HIPAA Compliance -->
  <rect x="260" y="90" width="80" height="25" rx="5" fill="#111530" stroke="#EB3443" strokeWidth="1.5"/>
  <text x="300" y="107" fill="#FFFFFF" font-size="14" text-anchor="middle" font-family="Arial">HIPAA</text>
  
  <!-- Text -->
  <text x="300" y="350" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">Healthcare Cybersecurity</text>
  <text x="300" y="375" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Patient Data Protection</text>
</svg>