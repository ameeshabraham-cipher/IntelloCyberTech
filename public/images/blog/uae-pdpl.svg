<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  
  <!-- UAE Flag Inspired Background -->
  <rect x="150" y="100" width="300" height="75" fill="#111530" stroke="#00E5FF" strokeWidth="1"/>
  <rect x="150" y="175" width="300" height="75" fill="#111530" stroke="#00E5FF" strokeWidth="1"/>
  <rect x="150" y="250" width="300" height="75" fill="#111530" stroke="#00E5FF" strokeWidth="1"/>
  
  <!-- UAE Flag Colors as Accents -->
  <rect x="150" y="100" width="60" height="225" fill="#111530" stroke="#EB3443" strokeWidth="2"/>
  
  <!-- Document Icon with Privacy Shield -->
  <rect x="270" y="140" width="80" height="100" rx="5" fill="#111530" stroke="#FFFFFF" strokeWidth="2"/>
  <path d="M285 140 L285 118 L335 118 L335 140" stroke="#FFFFFF" strokeWidth="2" fill="none"/>
  <path d="M310 118 Q325 130 340 118" stroke="#FFFFFF" strokeWidth="1" fill="none"/>
  
  <!-- Privacy Shield -->
  <path d="M310 160 Q330 170 330 190 Q330 210 310 220 Q290 210 290 190 Q290 170 310 160" fill="none" stroke="#00E5FF" strokeWidth="2"/>
  <path d="M303 190 L308 195 L318 185" stroke="#00E5FF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
  
  <!-- Data Flow -->
  <path d="M230 170 C 250 150, 270 190, 290 170" stroke="#EB3443" strokeWidth="1.5" fill="none" strokeDasharray="4 2"/>
  <path d="M330 170 C 350 150, 370 190, 390 170" stroke="#EB3443" strokeWidth="1.5" fill="none" strokeDasharray="4 2"/>
  
  <!-- Privacy Lock -->
  <circle cx="310" cy="250" r="20" fill="#111530" stroke="#00E5FF" strokeWidth="1.5"/>
  <rect x="300" y="240" width="20" height="25" rx="3" fill="#111530" stroke="#00E5FF" strokeWidth="1.5"/>
  <circle cx="310" cy="245" r="3" fill="#00E5FF"/>
  
  <!-- Text -->
  <text x="300" y="330" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">UAE PDPL</text>
  <text x="300" y="355" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Personal Data Protection Law</text>
</svg>