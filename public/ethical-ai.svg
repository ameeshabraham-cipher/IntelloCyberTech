<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  
  <!-- Network/Grid Background -->
  <g opacity="0.2">
    <path d="M100 100 H500" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M100 150 H500" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M100 200 H500" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M100 250 H500" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M100 300 H500" stroke="#00E5FF" strokeWidth="1"/>
    
    <path d="M150 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M200 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M250 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M300 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M350 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M400 100 V300" stroke="#00E5FF" strokeWidth="1"/>
    <path d="M450 100 V300" stroke="#00E5FF" strokeWidth="1"/>
  </g>
  
  <!-- Central Computer System -->
  <rect x="250" y="170" width="100" height="60" rx="5" fill="#111530" stroke="#FFFFFF" strokeWidth="2"/>
  <rect x="280" y="180" width="40" height="25" rx="2" fill="#111530" stroke="#00E5FF" strokeWidth="1.5"/>
  <rect x="260" y="230" width="80" height="10" rx="2" fill="#111530" stroke="#FFFFFF" strokeWidth="1"/>
  
  <!-- APT Attack Vectors -->
  <g>
    <!-- Hidden Threats -->
    <circle cx="150" cy="150" r="15" fill="#111530" stroke="#EB3443" strokeWidth="1.5" opacity="0.8"/>
    <path d="M150 150 L250 170" stroke="#EB3443" strokeWidth="1" strokeDasharray="5 3"/>
    <text x="150" y="145" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Stealth</text>
    <text x="150" y="157" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Attack</text>
    
    <!-- Persistence -->
    <circle cx="200" cy="250" r="15" fill="#111530" stroke="#EB3443" strokeWidth="1.5" opacity="0.8"/>
    <path d="M200 250 L250 210" stroke="#EB3443" strokeWidth="1" strokeDasharray="5 3"/>
    <text x="200" y="245" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Back</text>
    <text x="200" y="255" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">door</text>
    
    <!-- Data Exfiltration -->
    <circle cx="400" cy="150" r="15" fill="#111530" stroke="#EB3443" strokeWidth="1.5" opacity="0.8"/>
    <path d="M400 150 L350 170" stroke="#EB3443" strokeWidth="1" strokeDasharray="5 3"/>
    <text x="400" y="145" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Data</text>
    <text x="400" y="157" fill="#FFFFFF" font-size="10" text-anchor="middle" font-family="Arial">Theft</text>
    
    <!-- Command & Control -->
    <circle cx="450" cy="250" r="15" fill="#111530" stroke="#EB3443" strokeWidth="1.5" opacity="0.8"/>
    <path d="M450 250 L350 210" stroke="#EB3443" strokeWidth="1" strokeDasharray="5 3"/>
    <text x="450" y="245" fill="#FFFFFF" font-size="8" text-anchor="middle" font-family="Arial">Command</text>
    <text x="450" y="255" fill="#FFFFFF" font-size="8" text-anchor="middle" font-family="Arial">& Control</text>
  </g>
  
  <!-- APT Eye -->
  <circle cx="300" cy="130" r="25" fill="#111530" stroke="#EB3443" strokeWidth="2"/>
  <circle cx="300" cy="130" r="10" fill="#EB3443"/>
  <path d="M270 130 C 285 110, 315 110, 330 130" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
  <path d="M270 130 C 285 150, 315 150, 330 130" stroke="#EB3443" strokeWidth="1.5" fill="none"/>
  
  <!-- Text -->
  <text x="300" y="330" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">Advanced Persistent Threats</text>
  <text x="300" y="355" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Detection & Mitigation</text>
</svg>