<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#0A1025" />
  <circle cx="300" cy="200" r="120" fill="#111530" stroke="#00B2A9" strokeWidth="1" opacity="0.5"/>
  <circle cx="300" cy="200" r="90" fill="none" stroke="#00E5FF" strokeWidth="2"/>
  
  <!-- EU Stars Circle -->
  <g transform="translate(300, 200) scale(0.8)">
    <path d="M0 -90 L0 90" stroke="#00E5FF" strokeWidth="1" opacity="0.3"/>
    <path d="M-90 0 L90 0" stroke="#00E5FF" strokeWidth="1" opacity="0.3"/>
    <path d="M-63.6 -63.6 L63.6 63.6" stroke="#00E5FF" strokeWidth="1" opacity="0.3"/>
    <path d="M-63.6 63.6 L63.6 -63.6" stroke="#00E5FF" strokeWidth="1" opacity="0.3"/>
    
    <!-- 12 stars -->
    <g fill="#EB3443">
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(0)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(30)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(60)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(90)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(120)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(150)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(180)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(210)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(240)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(270)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(300)"/>
      <polygon points="0,-80 5,-68 18,-68 8,-60 12,-48 0,-56 -12,-48 -8,-60 -18,-68 -5,-68" transform="rotate(330)"/>
    </g>
  </g>
  
  <!-- Shield Symbol -->
  <path d="M300 150 Q340 170 340 220 Q340 270 300 300 Q260 270 260 220 Q260 170 300 150" fill="#111530" stroke="#00E5FF" strokeWidth="2"/>
  <path d="M285 220 L295 230 L315 210" stroke="#00E5FF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
  
  <!-- Text -->
  <text x="300" y="350" fill="#FFFFFF" font-size="24" text-anchor="middle" font-family="Arial">GDPR Compliance</text>
  <text x="300" y="375" fill="#EB3443" font-size="16" text-anchor="middle" font-family="Arial">Data Protection Framework</text>
